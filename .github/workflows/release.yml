name: Create Release

on:
  push:
    tags:
      - '*.*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          $version = '${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Release tag must use four-part version format, got: $version"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dalamudPath = "$env:AppData\XIVLauncherCN\addon\Hooks\dev\"
          New-Item -ItemType Directory -Force -Path $dalamudPath | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -OutFile dalamud.zip -UseBasicParsing
          Expand-Archive -Force dalamud.zip $dalamudPath

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore ./ArenaPilot.csproj

      - name: Build release package
        shell: pwsh
        run: |
          $dalamudPath = "$env:AppData\XIVLauncherCN\addon\Hooks\dev\"
          dotnet build ./ArenaPilot.csproj `
            --configuration Release `
            --no-restore `
            --nologo `
            -p:DalamudLibPath="$dalamudPath" `
            -p:Version="$env:RELEASE_VERSION" `
            -p:FileVersion="$env:RELEASE_VERSION" `
            -p:AssemblyVersion="$env:RELEASE_VERSION"

      - name: Validate output
        shell: pwsh
        run: |
          $required = @(
            './output/ArenaPilot.dll',
            './output/ArenaPilot.json',
            './output/ArenaPilot.deps.json',
            './output/icon.png'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required release file is missing: $path"
            }
          }
          $manifest = Get-Content -Raw -Encoding UTF8 './output/ArenaPilot.json' | ConvertFrom-Json
          if ($manifest.AssemblyVersion -ne $env:RELEASE_VERSION) {
            throw "Manifest version $($manifest.AssemblyVersion) does not match tag $env:RELEASE_VERSION"
          }

      - name: Archive release asset
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./output/ArenaPilot.dll,./output/ArenaPilot.json,./output/ArenaPilot.deps.json,./output/icon.png `
            -DestinationPath ./ArenaPilot.zip `
            -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ArenaPilot-斗兽塔助手 ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ./ArenaPilot.zip
          fail_on_unmatched_files: true
